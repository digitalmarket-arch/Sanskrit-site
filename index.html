<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanskritam Daily</title>
<meta name="description" content="One Sanskrit lesson a day: video, explanation, audio and quiz, from the sounds to the Gītā.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one reading column (max 44rem) under a sticky wordmark bar. Home = today's lesson, a progress board and the course list by stage.
   Lesson = a reading page in the same order as the chat lesson: video, idea, examples, say it aloud, words, audio, quiz. */
:root {
  --bg: #f1f0eb;
  --surface: #fbfaf7;
  --surface-2: #e9e7df;
  --fg: #1f1c18;
  --muted: #68625a;
  --line: #d8d4ca;
  --accent: #2c3b8a;
  --accent-ink: #ffffff;
  --accent-soft: #e4e7f6;
  --saffron: #c4701a;
  --saffron-soft: #f6e5d0;
  --ok: #2b7a4e;
  --ok-soft: #dcefe3;
  --bad: #ae392d;
  --bad-soft: #f6dcd8;
  --dev: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", "Mangal", serif;
  --body: "Gentium Plus", "Gentium Book Plus", "Charis SIL", "Noto Serif", Georgia, "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", serif;
  --ui: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161d; --surface: #1c1f28; --surface-2: #262a36; --fg: #ebe6dc; --muted: #a39c90; --line: #2f3340;
    --accent: #a3aeff; --accent-ink: #10132a; --accent-soft: #252a45; --saffron: #e3a04d; --saffron-soft: #3a2d1c;
    --ok: #7bcf9d; --ok-soft: #1f3a2b; --bad: #f08c80; --bad-soft: #452523; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161d; --surface: #1c1f28; --surface-2: #262a36; --fg: #ebe6dc; --muted: #a39c90; --line: #2f3340;
  --accent: #a3aeff; --accent-ink: #10132a; --accent-soft: #252a45; --saffron: #e3a04d; --saffron-soft: #3a2d1c;
  --ok: #7bcf9d; --ok-soft: #1f3a2b; --bad: #f08c80; --bad-soft: #452523; color-scheme: dark;
}

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
h1, h2, h3 { font-weight: 400; line-height: 1.2; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; }
img, iframe, video { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 44rem; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding-block: .55rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wordmark { display: flex; align-items: baseline; gap: .6rem; text-decoration: none; color: var(--fg); min-width: 0; }
.wordmark .dev { font-size: 1.15rem; color: var(--accent); }
.wordmark .en { font-family: var(--ui); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.chip { font-family: var(--ui); font-size: .78rem; padding: .25rem .6rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

main { max-width: 44rem; margin: 0 auto; padding-block: 1.25rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--ui); font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dev { font-family: var(--dev); }
.iast { font-style: italic; }
.muted { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }
.small { font-family: var(--ui); font-size: .85rem; }

/* home */
.hero { padding-block: 1.25rem .5rem; }
.hero h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); }
.hero .sub { margin: .35rem 0 0; color: var(--muted); max-width: 32rem; }
.today { margin-top: 1.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem 1.2rem; display: grid; gap: .5rem; }
.today h2 { font-size: 1.5rem; }
.today .meta { display: flex; flex-wrap: wrap; gap: .4rem 1rem; color: var(--muted); font-family: var(--ui); font-size: .85rem; }
.btn { display: inline-flex; align-items: center; gap: .45rem; font-family: var(--ui); font-size: .95rem; font-weight: 700; text-decoration: none;
  padding: .6rem 1rem; border-radius: 10px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.secondary { background: transparent; color: var(--accent); border-color: var(--line); }
.btn:disabled { opacity: .55; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: .3rem; }

.board { margin-top: 1.5rem; display: grid; gap: .8rem; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .7rem .85rem; min-width: 0; }
.tile .v { font-family: var(--ui); font-size: 1.55rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .v small { font-size: .9rem; font-weight: 400; color: var(--muted); }
.tile .l { font-family: var(--ui); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: .2rem; }
.bars { display: grid; gap: .5rem; }
.bars .row { display: flex; justify-content: space-between; gap: 1rem; font-family: var(--ui); font-size: .85rem; }
.track { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--saffron); width: 0; transition: width .4s ease; }
.note { font-family: var(--ui); font-size: .82rem; color: var(--muted); }

.course { margin-top: 2rem; }
.course h2 { font-size: 1.3rem; margin-bottom: .25rem; }
.stage { margin-top: 1.4rem; }
.stage-h { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding-bottom: .4rem; border-bottom: 1px solid var(--line); }
.stage-h h3 { font-size: 1.05rem; }
.stage-h span { font-family: var(--ui); font-size: .8rem; color: var(--muted); white-space: nowrap; }
.days { list-style: none; margin: 0; padding: 0; }
.day { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; align-items: center; gap: .6rem; padding: .5rem 0; border-bottom: 1px solid var(--line); min-width: 0; }
.day .n { font-family: var(--ui); font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; }
.day a, .day .t { text-decoration: none; color: var(--fg); }
.day .t { min-width: 0; }
.day.up { color: var(--muted); }
.day.up .t { color: var(--muted); }
.day .st { font-family: var(--ui); font-size: .78rem; white-space: nowrap; color: var(--muted); display: flex; align-items: center; gap: .45rem; }
.day .st.open { color: var(--accent); font-weight: 700; }
.day .st .score { color: var(--ok); font-weight: 700; }
.day.review .t::after { content: " review"; font-family: var(--ui); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--saffron); margin-left: .35rem; }
.ticks { display: inline-flex; gap: .2rem; }
.tick { width: 1.15rem; height: 1.15rem; border-radius: 50%; display: inline-grid; place-items: center; font-size: .62rem; font-family: var(--ui); background: var(--surface-2); color: var(--muted); }
.tick.on { background: var(--ok-soft); color: var(--ok); }
.how { margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .95rem; }
.how ol { padding-left: 1.2rem; margin: .4rem 0; }

/* lesson */
.crumbs { display: flex; justify-content: space-between; gap: 1rem; align-items: center; font-family: var(--ui); font-size: .85rem; }
.crumbs a { text-decoration: none; }
.lesson-h { margin-top: .8rem; }
.lesson-h h1 { font-size: clamp(1.7rem, 5.5vw, 2.3rem); margin-top: .2rem; }
.lesson-h .meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; color: var(--muted); font-family: var(--ui); font-size: .85rem; margin-top: .45rem; }
.steps { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }
.step { font-family: var(--ui); font-size: .78rem; padding: .25rem .6rem; border-radius: 999px; background: var(--surface-2); color: var(--muted); display: inline-flex; gap: .35rem; align-items: center; }
.step.on { background: var(--ok-soft); color: var(--ok); }
.done-btn { font-family: var(--ui); font-size: .8rem; padding: .25rem .6rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.done-btn.on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.section { margin-top: 1.9rem; }
.section > h2 { font-size: 1.25rem; padding-bottom: .3rem; border-bottom: 1px solid var(--line); margin-bottom: .7rem; display: flex; align-items: baseline; gap: .6rem; }
.section > h2 .k { font-family: var(--ui); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--saffron); }
.recap { background: var(--saffron-soft); border-radius: 10px; padding: .7rem .9rem; margin-top: 1rem; font-size: .97rem; }
.player { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.player + .player { margin-top: .9rem; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; }
.frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.player .cap { padding: .75rem .95rem; }
.player .vt { font-size: 1.05rem; line-height: 1.3; }
.player .vm { font-family: var(--ui); font-size: .82rem; color: var(--muted); margin-top: .15rem; }
.player .focus { margin: .5rem 0 0; font-size: .97rem; }
.player .row { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; margin-top: .6rem; font-family: var(--ui); font-size: .85rem; }
.player .row a { text-decoration: none; }
.pill { font-family: var(--ui); font-size: .8rem; padding: .25rem .65rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
.pill.on { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.sel { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.prose p { margin: 0 0 .8rem; }
.prose ul { margin: 0 0 .8rem; padding-left: 1.2rem; }
.prose li { margin: .15rem 0; }
.prose h3 { font-size: 1.05rem; margin: 1rem 0 .4rem; font-family: var(--ui); }
.prose .dev { font-size: 1.1em; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.rows li { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: .3rem .9rem; align-items: baseline; padding: .45rem 0; border-bottom: 1px dashed var(--line); min-width: 0; }
.rows .dev { font-size: 1.35rem; line-height: 1.3; }
.rows .iast { color: var(--accent); }
.rows .m { color: var(--muted); }
@media (max-width: 480px) { .rows li { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .rows .m { grid-column: 1 / -1; } }
.say { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
.say li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .7rem .9rem; }
.say .dev { font-size: 1.5rem; line-height: 1.35; display: block; }
.say .sub { color: var(--muted); font-size: .95rem; }
.audio { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem; display: grid; gap: .6rem; }
.audio audio { width: 100%; max-width: 100%; }
.audio .ctl { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; font-family: var(--ui); font-size: .85rem; color: var(--muted); }
.quiz { display: grid; gap: 1rem; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .85rem 1rem; }
.q .qt { display: flex; gap: .6rem; }
.q .qn { font-family: var(--ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.opts { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; gap: .4rem; }
.opt { width: 100%; text-align: left; display: flex; gap: .6rem; align-items: baseline; padding: .5rem .7rem; border-radius: 9px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
.opt .l { font-family: var(--ui); font-size: .8rem; color: var(--muted); min-width: 1.1rem; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q input[type=text] { width: 100%; max-width: 100%; margin-top: .6rem; font: inherit; font-size: 1.05rem; padding: .5rem .7rem; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.why { margin-top: .6rem; padding: .55rem .75rem; border-radius: 9px; background: var(--surface-2); font-size: .95rem; }
.why.right { background: var(--ok-soft); }
.why.wrong { background: var(--bad-soft); }
.selfmark { display: flex; gap: .5rem; margin-top: .5rem; }
.result { font-family: var(--ui); font-size: 1rem; padding: .7rem .9rem; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.teacher { font-family: var(--ui); font-size: .9rem; padding: .6rem .9rem; border-radius: 10px; background: var(--ok-soft); color: var(--ok); margin-bottom: .8rem; }
.extra { background: var(--saffron-soft); border-radius: 10px; padding: .7rem .9rem; }
.navrow { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2.2rem; padding-top: 1rem; border-top: 1px solid var(--line); font-family: var(--ui); font-size: .9rem; }
.navrow a { text-decoration: none; }
.empty { margin-top: 1.2rem; padding: 1.2rem; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="wordmark" href="#home"><span class="dev">संस्कृतं प्रतिदिनम्</span><span class="en">Sanskritam Daily</span></a>
    <span class="chip" id="chip" hidden></span>
  </div>
</header>
<main id="app">
  <section class="hero">
    <h1>Sanskritam Daily</h1>
    <p class="sub">One Sanskrit lesson a day: a video, a short explanation, words to say aloud, audio and a quiz. From the sounds to the Gītā.</p>
  </section>
  <div class="empty" id="boot">Loading the course…</div>
</main>

<script>
(function () {
  "use strict";
  // ---------- course plan ----------
  var BASE = Date.UTC(2026, 9, 29);            // Day N (N >= 2) is on 29 Oct 2026 + (N - 1) days
  var DAY1_DATE = Date.UTC(2026, 9, 27);        // Day 1 was taught on 27 Oct 2026
  var LESSON_TIME = "about 12:40 PM";
  var STAGES = [
    { name: "Stage 0 · Sounds and script", from: 1, to: 13 },
    { name: "Stage 1 · Foundations", from: 14, to: 111 }
  ];
  var TOPICS = {
    1: "The 13 vowels", 2: "Anusvāra and visarga", 3: "The 25 stop consonants and the nasals",
    4: "Hindi trouble spots: ट vs त, ण vs न, ङ and ञ", 5: "य र ल व, श ष स ह; ज्ञ and क्ष", 6: "Review: the sounds",
    7: "Virāma, conjuncts, reph and avagraha", 8: "IAST: the Roman letters", 9: "Syllables: light and heavy",
    10: "A first look at sandhi", 11: "Reading: ॐ सह नाववतु", 12: "Reading: Gītā 2.47", 13: "Stage 0 gate test",
    14: "First sentences: सः / सा + verb", 15: "अहम् / त्वम्; introducing yourself", 16: "All nine present forms of पठ्",
    17: "What cases are: 1st and 2nd case", 18: "Neuter -a nouns: फलम्", 19: "Question words; अस्ति / नास्ति",
    20: "Review + speaking task", 21: "3rd case: with, by", 22: "4th case: to, for", 23: "5th case: from", 24: "6th case: of",
    25: "7th case: in, on, at; the vocative", 26: "The full राम table", 27: "Review: cases", 28: "Feminine -ā nouns: लता",
    29: "Feminine dual and plural", 30: "The pronoun तद्: सः सा तत्", 31: "अस्मद् and युष्मद् in all cases",
    32: "Polite भवान् / भवती", 33: "Common indeclinables", 34: "Review + a short dialogue", 35: "Imperative (लोट्)",
    36: "Future (लृट्)", 37: "Past (लङ्)", 38: "Spoken past: -तवान् / -तवती", 39: "Verbs with special present stems",
    40: "Numbers 1–20 and telling time", 41: "Review: your day in three tenses", 42: "Masculine -i nouns: हरि",
    43: "Masculine -u nouns: गुरु", 44: "Feminine -ī and -i nouns: नदी, मति", 45: "Adjectives agree",
    46: "Vowel sandhi 1: dīrgha and guṇa", 47: "Vowel sandhi 2: vṛddhi and yaṇ", 48: "Review", 49: "Having done: क्त्वा / ल्यप्",
    50: "To do: तुमुन्", 51: "The past participle (क्त)", 52: "Guided reading: NCERT Deepakam 6", 53: "Visarga sandhi basics",
    54: "Speaking at home and at the market", 55: "Review: mini gate quiz"
  };
  var BLOCKS = [
    [56, 62, "The optative (विधिलिङ्); यदि–तर्हि; the relative यद्"],
    [63, 69, "Consonant sandhi basics; reading Deepakam 7"],
    [70, 76, "Full -i, -u, -ī tables; numbers 1–4 declined"],
    [77, 83, "Ātmanepada verbs"],
    [84, 90, "Present participles; gerundives"],
    [91, 97, "Compounds: dvandva, tatpuruṣa, karmadhāraya, bahuvrīhi"],
    [98, 104, "Passive voice; causative"],
    [105, 111, "Consonant-stem nouns; one Gītā 12 verse a day"]
  ];
  var WORDS_PER_LESSON = 5;
  function topicOf(n) {
    if (TOPICS[n]) return TOPICS[n];
    for (var i = 0; i < BLOCKS.length; i++) if (n >= BLOCKS[i][0] && n <= BLOCKS[i][1]) return (n === BLOCKS[i][1] ? "Review · " : "") + BLOCKS[i][2];
    return "Stage 2";
  }
  function isReview(n) { return n % 7 === 6; }
  function stageOf(n) { for (var i = 0; i < STAGES.length; i++) if (n >= STAGES[i].from && n <= STAGES[i].to) return STAGES[i].name; return "Stage 2"; }

  // ---------- dates ----------
  var DAYN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var DAY_MS = 86400e3;
  function istDate(ms) { var t = new Date((ms == null ? Date.now() : ms) + 5.5 * 3600e3); return Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); }
  function dayDate(n) { return n === 1 ? DAY1_DATE : BASE + (n - 1) * DAY_MS; }
  function todayDay() { return Math.floor((istDate() - BASE) / DAY_MS) + 1; }
  function fmt(ms, withYear) { var d = new Date(ms); return DAYN[d.getUTCDay()] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()] + (withYear ? " " + d.getUTCFullYear() : ""); }
  function parseDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; }
  function pad3(n) { return (n < 10 ? "00" : n < 100 ? "0" : "") + n; }

  // ---------- progress ----------
  // Two sources: (1) what you do on this device (watched, listened, self-check quiz), kept in this browser;
  // (2) results the teacher recorded after you replied in the chat, published as data/progress.json for every device.
  var KEY = "sanskritam-daily.progress.v2", OLD_KEY = "sanskritam-daily.progress";
  function loadLocal() {
    var p = null;
    try { p = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { p = null; }
    if (!p || typeof p !== "object") p = { days: {} };
    if (!p.days) p.days = {};
    try { // carry over the first version's ticks
      var old = JSON.parse(localStorage.getItem(OLD_KEY) || "null");

        var ansText = String(q.answer == null ? "" : q.answer);
        if (q.options && q.options.length) {
          var ai = /^[a-z]$/i.test(ansText.trim()) ? ansText.trim().toLowerCase().charCodeAt(0) - 97 : q.options.findIndex(function (o) { return norm(o) === norm(ansText); });
          var ok = picked[i] === ai;
          if (ok) score++;
          Array.prototype.forEach.call(qEl.querySelectorAll(".opt"), function (x, j) { x.classList.remove("sel"); if (j === ai) x.classList.add("right"); else if (j === picked[i]) x.classList.add("wrong"); x.disabled = true; });
          why.className = "why " + (ok ? "right" : "wrong");
          why.innerHTML = (ok ? "<strong>Right.</strong> " : picked[i] == null ? "<strong>Not answered.</strong> " : "<strong>Not quite.</strong> ") + inline(q.why || "");
          why.hidden = false;
        } else {
          var inp = qEl.querySelector("input"), given = inp ? inp.value : "";
          var accepted = [ansText].concat(q.accept || []);
          var auto = given.trim() && accepted.some(function (a) { return norm(a) === norm(given); });
          if (inp) inp.disabled = true;
          if (auto) { score++; why.className = "why right"; why.innerHTML = "<strong>Right.</strong> " + inline(q.why || ""); why.hidden = false; }
          else {
            open++;
            why.className = "why";
            why.innerHTML = "<strong>Answer:</strong> " + inline(ansText) + (q.why ? "<br>" + inline(q.why) : "") + '<div class="selfmark"><button class="pill" type="button" data-self="1">I had it right</button><button class="pill" type="button" data-self="0">I missed it</button></div>';
            why.hidden = false;
            Array.prototype.forEach.call(why.querySelectorAll("[data-self]"), function (b) {
              b.addEventListener("click", function () {
                self[i] = b.getAttribute("data-self") === "1";
                Array.prototype.forEach.call(why.querySelectorAll("[data-self]"), function (x) { x.classList.toggle("sel", x === b); });
                why.className = "why " + (self[i] ? "right" : "wrong");
                finish();
              });
            });
          }
        }
      });
      this.disabled = true;
      function finish() {
        var s = score; for (var k in self) if (self[k]) s++;
        var res = document.getElementById("result"), waiting = open - Object.keys(self).length;
        res.hidden = false;
        res.textContent = "Score: " + s + " of " + total + (waiting > 0 ? " so far. Mark the typed answers above." : s === total ? ". Excellent." : s >= total - 1 ? ". Good. Re-read the ones you missed." : ". Read today’s idea once more, then try the audio again.");
        if (waiting <= 0) { mark(n, { quiz: { score: s, total: total, at: new Date().toISOString() }, done: (local.days[n] || {}).done || new Date().toISOString() }); renderSteps(); }
      }
      finish();
    });
  }

  // ---------- router ----------
  var teacherLoaded = loadTeacher();
  function route() {
    var m = /^#day-(\d{1,3})$/.exec(location.hash || "");
    if (m) {
      var n = +m[1];
      app.innerHTML = '<nav class="crumbs"><a href="#home">‹ Course</a></nav><div class="empty">Loading Day ' + n + "…</div>";
      Promise.all([teacherLoaded, loadLatest()]).then(function () { return loadLesson(n); }).then(function (l) { renderLesson(n, l); updateChip(); }).catch(function () {
        app.innerHTML = '<nav class="crumbs"><a href="#home">‹ Course</a></nav><div class="empty">Day ' + n + " isn’t published yet. " + (n >= 2 ? "It is due on " + fmt(dayDate(n), true) + " at " + LESSON_TIME + "." : "") + "</div>";
      });
    } else {
      Promise.all([teacherLoaded, loadLatest()]).then(function (r) {
        var has = r[1], show = Math.min(todayDay(), has || 0);
        return show >= 1 ? loadLesson(show).catch(function () { return null; }) : null;
      }).then(function () { renderHome(); updateChip(); }).catch(function () { renderHome(); });
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
