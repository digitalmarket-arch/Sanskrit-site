<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanskritam Daily</title>
<meta name="description" content="One Sanskrit lesson a day: video, explanation, interactive varṇamālā, audio, flashcards, and quiz — from the sounds to the Gītā.">
<meta property="og:title" content="Sanskritam Daily">
<meta property="og:description" content="One Sanskrit lesson a day: video, explanation, interactive varṇamālā, audio, flashcards, and quiz — from the sounds to the Gītā.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Archival Scholarly Theme & Asymmetric Two-Column Reading System */
:root {
  --bg: #f4f1ea;
  --surface: #fbfaf7;
  --surface-2: #eae6dc;
  --surface-3: #e0dbd0;
  --fg: #1c1915;
  --muted: #655e54;
  --line: #d8d3c8;
  --accent: #23347e;
  --accent-ink: #ffffff;
  --accent-soft: #e3e7f7;
  --saffron: #b86214;
  --saffron-soft: #f5e6d3;
  --ok: #236e42;
  --ok-soft: #dbf0e3;
  --bad: #a63226;
  --bad-soft: #f7dcd8;
  --dev: "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", "Kohinoor Devanagari", "Mangal", serif;
  --body: "Gentium Plus", "Gentium Book Plus", "Charis SIL", "Noto Serif", Georgia, "Tiro Devanagari Sanskrit", "Noto Serif Devanagari", serif;
  --ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a;
    --surface: #1a1d26;
    --surface-2: #232733;
    --surface-3: #2d3242;
    --fg: #ede8df;
    --muted: #a39c90;
    --line: #2d3240;
    --accent: #a6b1ff;
    --accent-ink: #0f1329;
    --accent-soft: #232946;
    --saffron: #e5a24f;
    --saffron-soft: #382b1b;
    --ok: #7ad19e;
    --ok-soft: #1d3829;
    --bad: #f28d82;
    --bad-soft: #422321;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a;
  --surface: #1a1d26;
  --surface-2: #232733;
  --surface-3: #2d3242;
  --fg: #ede8df;
  --muted: #a39c90;
  --line: #2d3240;
  --accent: #a6b1ff;
  --accent-ink: #0f1329;
  --accent-soft: #232946;
  --saffron: #e5a24f;
  --saffron-soft: #382b1b;
  --ok: #7ad19e;
  --ok-soft: #1d3829;
  --bad: #f28d82;
  --bad-soft: #422321;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
}
a { color: var(--accent); text-underline-offset: 3px; }
h1, h2, h3, h4 { font-weight: 400; line-height: 1.22; text-wrap: balance; margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
img, iframe, video { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* Typography helpers */
.eyebrow {
  font-family: var(--ui);
  font-size: .76rem;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
}
.dev { font-family: var(--dev); }
.iast { font-style: italic; }
.muted { color: var(--muted); }
.mono { font-variant-numeric: tabular-nums; }
.small { font-family: var(--ui); font-size: .85rem; }

/* 3-Zone Top Bar Contract */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 15;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar-in {
  max-width: 72rem;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
  padding-block: .65rem;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.wordmark {
  display: inline-flex;
  align-items: baseline;
  gap: .55rem;
  text-decoration: none;
  color: var(--fg);
  white-space: nowrap;
  flex-shrink: 0;
}
.wordmark .dev { font-size: 1.2rem; color: var(--accent); }
.wordmark .en {
  font-family: var(--ui);
  font-size: .86rem;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--fg);
}
.topnav {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  font-family: var(--ui);
  font-size: .88rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.topnav::-webkit-scrollbar { display: none; }
.topnav a {
  text-decoration: none;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
  padding-block: .25rem;
  border-bottom: 2px solid transparent;
  transition: color .15s ease, border-color .15s ease;
}
.topnav a:hover { color: var(--fg); }
.topnav a.active {
  color: var(--fg);
  font-weight: 700;
  border-bottom-color: var(--saffron);
}
.bar-actions {
  display: flex;
  align-items: center;
  gap: .65rem;
  flex-shrink: 0;
}
.theme-btn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  font-family: var(--ui);
  font-size: .8rem;
  padding: .38rem .7rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.theme-btn:hover { color: var(--fg); background: var(--surface-2); }
.bar-cta {
  display: inline-flex;
  align-items: center;
  font-family: var(--ui);
  font-size: .82rem;
  font-weight: 700;
  text-decoration: none;
  padding: .42rem .85rem;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-ink);
  white-space: nowrap;
  flex-shrink: 0;
  transition: opacity .15s ease;
}
.bar-cta:hover { opacity: .92; }
.read-progress {
  height: 2px;
  background: transparent;
  width: 100%;
  overflow: hidden;
}
.read-progress > span {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--saffron);
  transition: width .12s ease-out;
}
@media (max-width: 760px) {
  .bar-in { gap: .75rem; flex-wrap: wrap; }
  .topnav { order: 3; width: 100%; gap: 1.15rem; padding-top: .25rem; border-top: 1px solid var(--line); }
}

/* Main Container & Asymmetric Grid */
main {
  max-width: 72rem;
  margin: 0 auto;
  padding-block: 1.75rem 4.5rem;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* Buttons & Segmented Controls */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  font-family: var(--ui);
  font-size: .92rem;
  font-weight: 700;
  text-decoration: none;
  padding: .58rem 1.1rem;
  border-radius: 9px;
  border: 1px solid transparent;
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: opacity .15s ease, transform .12s ease;
}
.btn:hover:not(:disabled) { opacity: .92; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.secondary {
  background: transparent;
  color: var(--fg);
  border-color: var(--line);
  font-weight: 400;
}
.btn.secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn.subtle {
  background: var(--surface-2);
  color: var(--fg);
  font-weight: 400;
  padding: .42rem .8rem;
  font-size: .84rem;
}
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: .65rem; align-items: center; margin-top: .5rem; }

/* Segmented filter bar */
.seg-bar {
  display: inline-flex;
  flex-wrap: wrap;
  gap: .25rem;
  padding: .25rem;
  background: var(--surface-2);
  border-radius: 10px;
  border: 1px solid var(--line);
}
.seg-btn {
  font-family: var(--ui);
  font-size: .8rem;
  padding: .35rem .75rem;
  border-radius: 7px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background-color .15s ease, color .15s ease;
}
.seg-btn:hover { color: var(--fg); }
.seg-btn.active {
  background: var(--surface);
  color: var(--fg);
  font-weight: 700;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}

/* Interactive Control Buttons (Audio, Watch, Rep) */
.ctl-btn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  font-family: var(--ui);
  font-size: .8rem;
  padding: .32rem .72rem;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background-color .15s ease, border-color .15s ease;
}
.ctl-btn:hover { background: var(--surface-2); }
.ctl-btn.on {
  background: var(--ok-soft);
  color: var(--ok);
  border-color: var(--ok);
  font-weight: 700;
}
.ctl-btn.sel {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
  font-weight: 700;
}
.ctl-btn.rec {
  background: var(--bad-soft);
  color: var(--bad);
  border-color: var(--bad);
  font-weight: 700;
}

/* Home Layout: 2-Column Editorial Hero + Ledger */
.home-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 2rem;
  align-items: stretch;
}
@media (max-width: 920px) {
  .home-grid { grid-template-columns: 1fr; gap: 1.5rem; }
}
.hero-col {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 1.25rem;
}
.hero h1 {
  font-size: clamp(2.1rem, 4.2vw, 3.1rem);
  letter-spacing: -.01em;
  margin-top: .2rem;
}
.hero .sub {
  margin: .45rem 0 0;
  color: var(--muted);
  max-width: 40rem;
  font-size: 1.05rem;
}
.today {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1.35rem 1.5rem;
  display: grid;
  gap: .65rem;
}
.today h2 { font-size: clamp(1.45rem, 2.5vw, 1.85rem); }
.meta-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .35rem .55rem;
  color: var(--muted);
  font-family: var(--ui);
  font-size: .84rem;
}
.meta-sep { color: var(--line); user-select: none; }
.today-preview {
  margin: .2rem 0;
  padding-top: .65rem;
  border-top: 1px solid var(--line);
  color: var(--fg);
  font-size: .98rem;
}
.today-preview .vowel-strip {
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
  margin-top: .55rem;
}
.vowel-key {
  font-family: var(--dev);
  font-size: 1.15rem;
  min-width: 2.2rem;
  height: 2.2rem;
  padding: 0 .45rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--bg);
  cursor: pointer;
  transition: transform .12s ease, border-color .15s ease, background-color .15s ease;
}
.vowel-key:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  transform: translateY(-1px);
}

/* Scholar's Study Ledger (Progress Board) */
.board {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1.35rem 1.4rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 1.1rem;
}
.board-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: .55rem;
  border-bottom: 1px solid var(--line);
}
.board-head h2 { font-size: 1.15rem; }
.tiles {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: .65rem;
}
.tile {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: .75rem .9rem;
  min-width: 0;
}
.tile .v {
  font-family: var(--ui);
  font-size: 1.55rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.tile .v small { font-size: .88rem; font-weight: 400; color: var(--muted); }
.tile .l {
  font-family: var(--ui);
  font-size: .74rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: .25rem;
}
.cadence {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .4rem;
  padding: .55rem .75rem;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-family: var(--ui);
  font-size: .78rem;
}
.cadence-days {
  display: flex;
  gap: .35rem;
  align-items: center;
}
.c-day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .15rem;
  font-size: .68rem;
  color: var(--muted);
}
.c-box {
  width: 1.35rem;
  height: 1.35rem;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid;
  place-items: center;
  font-size: .7rem;
  color: var(--muted);
}
.c-box.on {
  background: var(--ok-soft);
  border-color: var(--ok);
  color: var(--ok);
  font-weight: 700;
}
.bars { display: grid; gap: .6rem; }
.bars .row {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  font-family: var(--ui);
  font-size: .82rem;
  margin-bottom: .2rem;
}
.track { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--saffron); width: 0; transition: width .3s ease; }
.note { font-family: var(--ui); font-size: .81rem; color: var(--muted); margin: 0; }

/* Subhashitam / Daily Phrase Strip */
.subhashitam {
  margin-top: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1rem 1.35rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.subhashitam-main { display: grid; gap: .15rem; }
.subhashitam .dev-lg { font-family: var(--dev); font-size: 1.35rem; color: var(--fg); }

/* Course Syllabus Section */
.course { margin-top: 2.75rem; }
.course-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--line);
}
.course-toolbar h2 { font-size: 1.5rem; }
.course-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .75rem;
}
.search-inp {
  font-family: var(--ui);
  font-size: .85rem;
  padding: .42rem .8rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  min-width: 14rem;
}
.stage { margin-top: 1.75rem; }
.stage-h {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: .45rem;
  border-bottom: 1px solid var(--line);
}
.stage-h h3 { font-size: 1.15rem; font-weight: 700; }
.stage-h span { font-family: var(--ui); font-size: .82rem; color: var(--muted); white-space: nowrap; }
.days { list-style: none; margin: 0; padding: 0; }
.day {
  display: grid;
  grid-template-columns: 3.2rem minmax(0, 1fr) auto;
  align-items: center;
  gap: .75rem;
  padding: .6rem .35rem;
  border-bottom: 1px solid var(--line);
  min-width: 0;
  transition: background-color .12s ease;
}
.day:hover:not(.up) { background: var(--surface); }
.day .n {
  font-family: var(--ui);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  font-size: .88rem;
}
.day a, .day .t { text-decoration: none; color: var(--fg); }
.day a.t:hover { color: var(--accent); text-decoration: underline; }
.day .t { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: .45rem; }
.day.up { color: var(--muted); }
.day.up .t { color: var(--muted); }
.day .rev-tag {
  font-family: var(--ui);
  font-size: .72rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--saffron);
}
.day .st {
  font-family: var(--ui);
  font-size: .8rem;
  white-space: nowrap;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: .5rem;
}
.day .st.open { color: var(--accent); font-weight: 700; }
.day .st .score { color: var(--ok); font-weight: 700; font-variant-numeric: tabular-nums; }
.status-text {
  font-family: var(--ui);
  font-size: .78rem;
  color: var(--muted);
}
.status-text.done { color: var(--ok); font-weight: 700; }

.how {
  margin-top: 2.75rem;
  padding: 1.35rem 1.5rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--muted);
  font-size: .95rem;
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: 1.5rem;
  align-items: start;
}
@media (max-width: 760px) { .how { grid-template-columns: 1fr; } }
.how ol { padding-left: 1.25rem; margin: .45rem 0 0; display: grid; gap: .25rem; }
.how-tools {
  border-left: 1px solid var(--line);
  padding-left: 1.25rem;
  display: grid;
  gap: .55rem;
}
@media (max-width: 760px) {
  .how-tools { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 1rem; }
}

/* Lesson Layout: Asymmetric 2-Column Reading Canvas + Sticky Companion Rail */
.lesson-shell {
  display: grid;
  grid-template-columns: minmax(0, 43rem) minmax(18rem, 23rem);
  gap: 2.5rem;
  align-items: start;
  justify-content: space-between;
}
@media (max-width: 980px) {
  .lesson-shell { grid-template-columns: 1fr; }
}
.lesson-main { min-width: 0; }
.lesson-rail {
  position: sticky;
  top: 4.5rem;
  display: grid;
  gap: 1.1rem;
}
.rail-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem 1.1rem;
  font-family: var(--ui);
  font-size: .85rem;
}
.rail-card h3 {
  font-family: var(--ui);
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .6rem;
}
.toc-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: .35rem;
}
.toc-list a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
  text-decoration: none;
  color: var(--fg);
  padding: .3rem .45rem;
  border-radius: 6px;
  transition: background-color .12s ease;
}
.toc-list a:hover { background: var(--surface-2); }
.toc-list .k { color: var(--saffron); font-variant-numeric: tabular-nums; font-weight: 700; margin-right: .4rem; }

<script>
(function () {
  "use strict";

  // ---------- theme management ----------
  var THEME_KEY = "sanskritam-daily.theme";
  function currentTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved === "dark" || saved === "light") return saved;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    var btn = document.getElementById("themeBtn");
    if (btn) btn.textContent = t === "dark" ? "☀ Light" : "☾ Dark";
  }
  applyTheme(currentTheme());
  document.getElementById("themeBtn").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
  });

  // ---------- scroll reading progress ----------
  window.addEventListener("scroll", function () {
    var bar = document.getElementById("readBar");
    if (!bar) return;
    if (!/^#day-\d+/.test(location.hash || "")) { bar.style.width = "0%"; return; }
    var doc = document.documentElement;
    var max = doc.scrollHeight - doc.clientHeight;
    var pct = max > 0 ? Math.min(100, Math.max(0, (window.scrollY / max) * 100)) : 0;
    bar.style.width = pct + "%";
  }, { passive: true });

  // ---------- speech synthesis helper ----------
  function speakSanskrit(text, rateOverride) {
    if (!("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      var clean = String(text || "").replace(/______|\.\.\./g, "").trim();
      var u = new SpeechSynthesisUtterance(clean);
      var voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      var chosen = voices.find(function (v) { return /^sa(-|_|$)/i.test(v.lang); }) ||
                   voices.find(function (v) { return /^hi(-|_|$)/i.test(v.lang); }) ||
                   voices.find(function (v) { return /india|hindi|sanskrit/i.test(v.name); });
      if (chosen) u.voice = chosen;
      u.lang = chosen ? chosen.lang : "hi-IN";
      u.rate = rateOverride || 0.82;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- Pāṇinian Varṇamālā reference data ----------

    var isMasteredBool = !!(rec ? rec.mastered : (local.masteredWords && local.masteredWords[dev]));

    var introMs = dayDate(wordDay || 1);

    if (!isMasteredBool) {
      var refUnmastered = (rec && rec.lastReviewedAt) ? rec.lastReviewedAt : introMs;
      var elapsedUnmastered = Math.max(0, now - refUnmastered);
      return {
        mastered: false,
        level: 0,
        intervalHours: 0,
        lastReviewedAt: refUnmastered,
        elapsedMs: elapsedUnmastered,
        remainingMs: 0,
        overdueMs: elapsedUnmastered,

      };

    var elapsedMs = Math.max(0, now - lastRev);

    if (elapsedMs >= intervalMs) {
      var overdueMs = elapsedMs - intervalMs;
      return {
        mastered: true,
        level: level,
        intervalHours: intervalHours,
        lastReviewedAt: lastRev,
        elapsedMs: elapsedMs,
        remainingMs: 0,
        overdueMs: overdueMs,
        flaggedForReview: true,
        flagType: "elapsed",
        priorityScore: 2000 + Math.min(999, Math.floor(overdueMs / 3600e3)),
        label: "▲ Flagged for Review · Interval Elapsed",
        detail: "Mastered (Box " + level + " · " + (intervalHours / 24) + "d interval) · " + fmtElapsed(elapsedMs) + " elapsed"

    }

    var remainingMs = intervalMs - elapsedMs;
    return {
      mastered: true,
      level: level,
      intervalHours: intervalHours,
      lastReviewedAt: lastRev,
      elapsedMs: elapsedMs,
      remainingMs: remainingMs,

  function buildCourseListHTML(has) {
    var q = syllabusState.query.trim().toLowerCase();
    var f = syllabusState.filter;
    var out = "";
    var anyMatch = false;

    STAGES.forEach(function (st) {
      if (f === "s0" && st.id !== "s0") return;
      if (f === "s1" && st.id !== "s1") return;

      var rowsHtml = "";
      for (var n = st.from; n <= st.to; n++) {
        var avail = n <= has, rv = isReview(n), blk = null;
        for (var bi = 0; bi < BLOCKS.length; bi++) if (n >= BLOCKS[bi][0] && n <= BLOCKS[bi][1]) blk = BLOCKS[bi];

        if (blk && !avail && !q && f === "all" && !syllabusState.expandBlocks) {
          var r = n; while (r < blk[1] && r + 1 > has) r++;
          rowsHtml += '<li class="day up"><span class="n mono">' + (r > n ? n + "–" + r : n) + '</span><span class="t">' + esc(blk[2]) + (r === blk[1] ? ' <span class="rev-tag">· review on Day ' + blk[1] + "</span>" : "") + '</span><span class="st">' + fmt(dayDate(n)) + (r > n ? " →" : "") + "</span></li>";
          anyMatch = true;
          n = r; continue;
        }

        if (f === "avail" && !avail) continue;
        if (f === "review" && !rv) continue;

        var title = (cache[n] && cache[n].title) || topicOf(n);
        if (q && title.toLowerCase().indexOf(q) === -1 && ("day " + n).indexOf(q) === -1) continue;

        anyMatch = true;
        var sx = state(n);
        rowsHtml += '<li class="day' + (avail ? "" : " up") + (rv ? " review" : "") + '"><span class="n mono">' + n + "</span>";
        rowsHtml += avail
          ? '<a class="t" href="#day-' + n + '"><span>' + esc(title) + '</span>' + (rv ? '<span class="rev-tag">· review</span>' : "") + "</a>"
          : '<span class="t"><span>' + esc(title) + '</span>' + (rv ? '<span class="rev-tag">· review</span>' : "") + "</span>";

        if (!avail) {
          rowsHtml += '<span class="st">' + fmt(dayDate(n)) + "</span>";
        } else {
          var qz = sx.teacher && sx.teacher.total ? sx.teacher : sx.quiz;
          var sc = qz && qz.total ? '<span class="score">' + qz.score + "/" + qz.total + "</span>" : "";
          var statusParts = [];
          if (sx.video) statusParts.push("Video ✓");
          if (sx.audio) statusParts.push("Audio ✓");
          if (qz && qz.total) statusParts.push("Quiz " + qz.score + "/" + qz.total);
          var summary = sx.done
            ? '<span class="status-text done">✓ Completed</span>' + (sc ? " · " + sc : "")
            : statusParts.length
              ? '<span class="status-text">' + statusParts.join(" · ") + "</span>"
              : '<span class="st open">Start lesson →</span>';
          rowsHtml += '<span class="st">' + summary + "</span>";
        }
        rowsHtml += "</li>";
      }

      if (rowsHtml) {
        out += '<div class="stage"><div class="stage-h"><h3>' + esc(st.name) + '</h3><span>Days ' + st.from + "–" + st.to + '</span></div><ul class="days">' + rowsHtml + "</ul></div>";
      }
    });

    if (!anyMatch) {
      out += '<div class="empty">No lessons match your current filter. Try clearing the search box or switching to "All Days".</div>';
    } else if (!q && f === "all") {
      out += '<div style="margin-top:.75rem"><button type="button" class="ctl-btn" id="toggleBlocksBtn">' + (syllabusState.expandBlocks ? "Collapse Days 56–111 into weekly blocks" : "Expand all individual days (Days 56–111)") + "</button></div>";
    }
    return out;
  }

    var impFile = document.getElementById("importFile");

    if (expBtn) {
      expBtn.addEventListener("click", function () {
        var payload = JSON.stringify({ progress: local, notes: loadNotes(), exportedAt: new Date().toISOString() }, null, 2);
        var blob = new Blob([payload], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "sanskritam-daily-backup.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        if (msg) msg.textContent = "✓ Progress backup downloaded.";
      });
    }
    if (impBtn && impFile) {
      impBtn.addEventListener("click", function () { impFile.click(); });
      impFile.addEventListener("change", function () {
        var file = impFile.files && impFile.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var data = JSON.parse(String(reader.result || "{}"));
            if (data.progress && data.progress.days) {
              local = data.progress;
              saveLocal(local);
            }
            if (data.notes) {
              try { localStorage.setItem(NOTES_KEY, JSON.stringify(data.notes)); } catch (e) {}
            }
            renderHome();
            updateHeaderStatus();
          } catch (e) {
            if (msg) msg.textContent = "Could not read backup JSON file.";
          }
        };
        reader.readAsText(file);
      });
    }
  }

  function collectAllWords() {
    var list = [], seen = {};
    Object.keys(cache).sort(function (a, b) { return (+a) - (+b); }).forEach(function (k) {
      var l = cache[k];
      if (!l) return;
      (l.words || []).forEach(function (w) {
        if (w && w.dev && !seen[w.dev]) {
          seen[w.dev] = 1;
          list.push({ dev: w.dev, iast: w.iast || "", meaning: w.meaning || "", day: l.day, kind: "Core Word" });
        }
      });
      (l.examples || []).forEach(function (ex) {
        if (ex && ex.dev && !seen[ex.dev]) {
          seen[ex.dev] = 1;
          list.push({ dev: ex.dev, iast: ex.iast || "", meaning: ex.meaning || "", day: l.day, kind: "Example" });
        }
      });
    });
    return list;
  }

  function lexRowHTML(w) {
    var srs = evaluateWordSRS(w.dev, w.day);
    var spk = String(w.dev || "").split("/")[0].trim();
    var srsText = srs.flaggedForReview
      ? '<span class="srs-flag-text">' + esc(srs.label) + '</span> · <span>' + esc(srs.detail) + '</span>'
      : '<span class="srs-ok-text">' + esc(srs.label) + '</span> · <span>' + esc(srs.detail) + '</span>';
    var btnLabel = srs.mastered && !srs.flaggedForReview
      ? "✓ Box " + srs.level
      : srs.mastered && srs.flaggedForReview
        ? "↻ Review Due (Box " + srs.level + ")"
        : "Mark Mastered";
    return '<li class="lex-row">' +
      '<span class="dev">' + esc(w.dev) + '</span>' +
      '<span class="iast">' + esc(w.iast) + '</span>' +
      '<span class="m">' + esc(w.meaning) + '</span>' +
      '<span class="srs-cell">' + srsText + '</span>' +
      '<span style="display:flex;gap:.35rem;align-items:center">' +
        '<button class="ctl-btn' + (srs.mastered && !srs.flaggedForReview ? " on" : srs.flaggedForReview && srs.mastered ? " sel" : "") + '" type="button" data-srs-row="' + esc(w.dev) + '">' + esc(btnLabel) + '</button>' +
        '<button class="speak-icon-btn" type="button" data-speak="' + esc(spk) + '">🔊</button>' +
      '</span></li>';
  }

  function renderWordsView() {
    document.title = "Lexicon & Flashcards (SRS) · Sanskritam Daily";
    setActiveNav("words");
    var bar = document.getElementById("readBar"); if (bar) bar.style.width = "0%";

    var allWords = collectAllWords();
    if (!allWords.length) allWords = [{ dev: "नमस्ते", iast: "namaste", meaning: "greetings, hello", day: 1, kind: "Core Word" }];

    // Evaluate SRS state across all words
    var annotated = allWords.map(function (w) {
      return { word: w, srs: evaluateWordSRS(w.dev, w.day) };
    });
    var flaggedList = annotated
      .filter(function (x) { return x.srs.flaggedForReview; })
      .sort(function (a, b) { return b.srs.priorityScore - a.srs.priorityScore; })
      .map(function (x) { return x.word; });
    var activeMasteredList = annotated
      .filter(function (x) { return x.srs.mastered && !x.srs.flaggedForReview; })
      .map(function (x) { return x.word; });
    var elapsedFlaggedCount = annotated.filter(function (x) { return x.srs.flagType === "elapsed"; }).length;

    var deckWords = fcState.deckFilter === "flagged"
      ? flaggedList
      : fcState.deckFilter === "mastered"
        ? activeMasteredList
        : allWords;

    var html = '<nav class="crumbs"><a href="#home">‹ Back to Course</a><span class="muted mono">Cumulative Lexicon · ' + allWords.length + " entries · " + flaggedList.length + " flagged for review · " + activeMasteredList.length + " mastered</span></nav>";
    html += '<header class="lesson-h"><span class="eyebrow">शब्दकोशः · Spaced Repetition Flashcards</span><h1>Lexicon &amp; SRS Recall Deck</h1></header>';

    // SRS Algorithm Status & Controls Bar
    html += '<section class="flashcard-stage" aria-label="Vocabulary flashcard deck">';
    html += '<div class="srs-bar">';
    html += '<div class="srs-metrics">';
    html += '<span><strong class="srs-flag-text mono">▲ ' + flaggedList.length + ' Flagged for Review</strong> <span class="muted">(' + (flaggedList.length - elapsedFlaggedCount) + ' unmastered · ' + elapsedFlaggedCount + ' interval elapsed)</span></span>';
    html += '<span class="meta-sep">·</span>';
    html += '<span><strong class="srs-ok-text mono">✓ ' + activeMasteredList.length + ' Mastered</strong> <span class="muted">(within interval)</span></span>';
    html += '</div>';

    // Time Elapsed Simulator to test SRS decay intervals
    html += '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:.45rem">';
    html += '<span class="muted">Simulate time elapsed:</span>';
    html += '<div class="seg-bar">';
    [
      [0, "Now"],
      [24 * 3600e3, "+1d"],
      [72 * 3600e3, "+3d"],
      [168 * 3600e3, "+7d"],
      [360 * 3600e3, "+15d"]
    ].forEach(function (t) {
      html += '<button type="button" class="seg-btn' + (srsSimOffsetMs === t[0] ? " active" : "") + '" data-simtime="' + t[0] + '">' + t[1] + '</button>';
    });
    html += '</div></div></div>';

    // Deck Filter & Prompt Direction Controls
    html += '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem">';
    html += '<div class="seg-bar" role="group" aria-label="Filter flashcard deck by SRS status">';
    html += '<button type="button" class="seg-btn' + (fcState.deckFilter === "all" ? " active" : "") + '" data-fcdeck="all">All Cards (' + allWords.length + ')</button>';
    html += '<button type="button" class="seg-btn' + (fcState.deckFilter === "flagged" ? " active" : "") + '" data-fcdeck="flagged">▲ Flagged for Review (' + flaggedList.length + ')</button>';
    html += '<button type="button" class="seg-btn' + (fcState.deckFilter === "mastered" ? " active" : "") + '" data-fcdeck="mastered">✓ Mastered (' + activeMasteredList.length + ')</button>';
    html += '</div>';

    html += '<div class="seg-bar">';
    html += '<button type="button" class="seg-btn' + (fcState.promptMode === "dev" ? " active" : "") + '" data-fcmode="dev">Devanagari → Meaning</button>';
    html += '<button type="button" class="seg-btn' + (fcState.promptMode === "en" ? " active" : "") + '" data-fcmode="en">Meaning → Sanskrit</button>';
    html += '</div></div>';

    if (!deckWords.length) {
      html += '<div class="empty" style="margin:0">' +
        (fcState.deckFilter === "flagged"
          ? "<strong>All words are currently mastered and within their review intervals!</strong><br>Use the <em>Simulate time elapsed (+1d / +3d / +7d)</em> selector above to preview when mastered words will become due for review, or switch to All Cards."
          : "No cards in the Mastered deck yet. Mark cards as Mastered to start their spaced repetition intervals (1d → 3d → 7d → 14d → 30d).") +
        '</div>';
    } else {
      if (fcState.idx >= deckWords.length) fcState.idx = 0;
      var cur = deckWords[fcState.idx];
      var curSRS = evaluateWordSRS(cur.dev, cur.day);
      var nextBox = curSRS.mastered ? Math.min(5, curSRS.level + 1) : 1;
      var nextIntDays = (SRS_INTERVALS_HOURS[nextBox] || 24) / 24;

      html += '<div class="fc-box' + (curSRS.flaggedForReview ? " flagged-due" : "") + '" id="fcBox" tabindex="0" role="button" aria-label="Click to flip flashcard">';
      html += '<div class="fc-srs-banner mono">';
      html += '<span>Card ' + (fcState.idx + 1) + ' of ' + deckWords.length + ' · Day ' + cur.day + '</span>';
      html += ' · ';
      html += curSRS.flaggedForReview
        ? '<span class="srs-flag-text">' + esc(curSRS.label) + '</span> (' + esc(curSRS.detail) + ')'
        : '<span class="srs-ok-text">' + esc(curSRS.label) + '</span> (' + esc(curSRS.detail) + ')';
      html += '</div>';

      if (fcState.promptMode === "dev") {
        html += '<div class="dev-xl">' + esc(cur.dev) + '</div>';
        if (fcState.flipped) {
          html += '<div class="iast-lg">' + esc(cur.iast) + '</div>';
          html += '<div class="meaning-lg">' + esc(cur.meaning) + '</div>';
        } else {
          html += '<div class="small muted">Click card to reveal IAST &amp; English meaning</div>';
        }
      } else {
        html += '<div class="meaning-lg">' + esc(cur.meaning) + '</div>';
        if (fcState.flipped) {
          html += '<div class="dev-xl">' + esc(cur.dev) + '</div>';
          html += '<div class="iast-lg">' + esc(cur.iast) + '</div>';
        } else {
          html += '<div class="small muted">Click card to reveal Sanskrit &amp; IAST</div>';
        }
      }
      html += '</div>';

      html += '<div class="btn-row" style="justify-content:center;margin:0">';
      html += '<button type="button" class="ctl-btn" id="fcPrev">‹ Previous</button>';
      html += '<button type="button" class="ctl-btn" id="fcFlip">Flip Card</button>';
      html += '<button type="button" class="ctl-btn" id="fcSpeak" data-speak="' + esc(cur.dev.split("/")[0].trim()) + '">🔊 Pronounce</button>';
      html += '<button type="button" class="ctl-btn' + (curSRS.mastered && !curSRS.flaggedForReview ? " on" : "") + '" id="fcMaster">✓ Mastered (Schedule +' + nextIntDays + 'd · Box ' + nextBox + ')</button>';
      html += '<button type="button" class="ctl-btn' + (!curSRS.mastered ? " sel" : "") + '" id="fcFlagReview">↻ Needs Review (Reset)</button>';
      html += '<button type="button" class="ctl-btn" id="fcNext">Next ›</button>';
      html += '</div>';
    }
    html += '</section>';

    // Searchable Lexicon Table with SRS Column
    var q = fcState.query.trim().toLowerCase();
    var filtered = allWords.filter(function (w) {
      if (!q) return true;
      return w.dev.toLowerCase().indexOf(q) !== -1 || w.iast.toLowerCase().indexOf(q) !== -1 || w.meaning.toLowerCase().indexOf(q) !== -1;
    });

    html += '<section class="section">';
    html += '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--line);margin-bottom:.8rem">';
    html += '<div><h2 style="margin:0;border:0;padding:0">Lexicon &amp; SRS Schedule (' + filtered.length + ')</h2><span class="small muted">SRS intervals expand each time you confirm mastery: Box 1 (1d) → Box 2 (3d) → Box 3 (7d) → Box 4 (14d) → Box 5 (30d).</span></div>';
    html += '<input type="search" class="search-inp" id="lexSearch" placeholder="Filter by Devanagari, IAST, or English…" value="' + esc(fcState.query) + '">';
    html += '</div>';
    html += '<ul class="rows" id="lexRows">' + filtered.map(lexRowHTML).join("") + '</ul>';
    html += '</section>';

    app.innerHTML = html;
    wireWordsView(allWords, deckWords);
  }

  function wireWordsView(allWords, deckWords) {
    var cur = deckWords && deckWords.length ? deckWords[fcState.idx] : null;
    var fcBox = document.getElementById("fcBox");
    if (fcBox && cur) {
      fcBox.addEventListener("click", function () {
        fcState.flipped = !fcState.flipped;
        renderWordsView();
      });
      document.getElementById("fcFlip").addEventListener("click", function () {
        fcState.flipped = !fcState.flipped;
        renderWordsView();
      });
      document.getElementById("fcPrev").addEventListener("click", function () {
        fcState.idx = (fcState.idx - 1 + deckWords.length) % deckWords.length;
        fcState.flipped = false;
        renderWordsView();
      });
      document.getElementById("fcNext").addEventListener("click", function () {
        fcState.idx = (fcState.idx + 1) % deckWords.length;
        fcState.flipped = false;
        renderWordsView();
      });
      document.getElementById("fcSpeak").addEventListener("click", function () {
        speakSanskrit(this.getAttribute("data-speak"));
      });
      document.getElementById("fcMaster").addEventListener("click", function () {
        updateWordSRS(cur.dev, "master");
        fcState.flipped = false;
        renderWordsView();
      });
      document.getElementById("fcFlagReview").addEventListener("click", function () {
        updateWordSRS(cur.dev, "flag");
        fcState.flipped = false;
        renderWordsView();
      });
    }

    Array.prototype.forEach.call(app.querySelectorAll("[data-fcdeck]"), function (b) {
      b.addEventListener("click", function () {
        fcState.deckFilter = b.getAttribute("data-fcdeck");
        fcState.idx = 0;
        fcState.flipped = false;
        renderWordsView();
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-simtime]"), function (b) {
      b.addEventListener("click", function () {
        srsSimOffsetMs = +b.getAttribute("data-simtime");
        fcState.idx = 0;
        renderWordsView();
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll("[data-fcmode]"), function (b) {
      b.addEventListener("click", function () {
        fcState.promptMode = b.getAttribute("data-fcmode");
        fcState.flipped = false;
        renderWordsView();
      });
    });

    function wireLexRowButtons() {
      bindSpeakButtons();
      Array.prototype.forEach.call(app.querySelectorAll("[data-srs-row]"), function (b) {
        b.onclick = function () {
          var devKey = b.getAttribute("data-srs-row");
          updateWordSRS(devKey, "toggle");
          renderWordsView();
        };
      });
    }

    var ls = document.getElementById("lexSearch");
    if (ls) {
      ls.addEventListener("input", function () {
        fcState.query = ls.value;
        var q = fcState.query.trim().toLowerCase();
        var filtered = allWords.filter(function (w) {
          if (!q) return true;
          return w.dev.toLowerCase().indexOf(q) !== -1 || w.iast.toLowerCase().indexOf(q) !== -1 || w.meaning.toLowerCase().indexOf(q) !== -1;
        });
        document.getElementById("lexRows").innerHTML = filtered.map(lexRowHTML).join("");
        wireLexRowButtons();
      });
    }
    wireLexRowButtons();
  }

  function bindSpeakButtons() {
    Array.prototype.forEach.call(app.querySelectorAll("[data-speak]"), function (b) {
      b.onclick = function () { speakSanskrit(b.getAttribute("data-speak")); };
    });
  }

  // ---------- YouTube players ----------
  var ytReady = false, pending = [];
  window.onYouTubeIframeAPIReady = function () { ytReady = true; pending.splice(0).forEach(attachPlayer); };
  function loadYT() {
    if (window.YT && window.YT.Player) { ytReady = true; return; }
    if (document.getElementById("yt-api")) return;
    var s = document.createElement("script"); s.id = "yt-api"; s.src = "https://www.youtube.com/iframe_api"; s.async = true; document.head.appendChild(s);
  }
  function attachPlayer(spec) {
    if (!ytReady) { pending.push(spec); return; }
    try {
      new YT.Player(spec.id, { events: { onStateChange: function (e) { if (e.data === YT.PlayerState.ENDED) spec.onEnd(); } } });
    } catch (e) {}
  }
  function playerHtml(v, idx, label, lazy, hidden) {
    var id = ytId(v.url), frameId = "yt-" + idx;
    var html = '<div class="player" id="player-wrap-' + idx + '"' + (hidden ? " hidden" : "") + ">";
    if (id) html += '<div class="frame"><iframe id="' + frameId + '" src="https://www.youtube-nocookie.com/embed/' + id + '?enablejsapi=1&rel=0&origin=' + encodeURIComponent(location.origin) + '" title="' + esc(v.title || "Video") + '" ' + (lazy ? 'loading="lazy" ' : "") + 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>';
    html += '<div class="cap">' + (label ? '<span class="eyebrow">' + esc(label) + "</span>" : "") + '<div class="vt">' + esc(v.title) + '</div><div class="vm">' + esc([v.channel, v.language, v.minutes ? v.minutes + " min" : ""].filter(Boolean).join(" · ")) + "</div>";
    if (v.focus) html += '<p class="focus"><strong>Watch for:</strong> ' + inline(v.focus) + "</p>";
    html += '<div class="row"><button class="ctl-btn" type="button" data-watch="' + idx + '">Mark Watched</button><a href="' + esc(v.url) + '" target="_blank" rel="noopener">Open on YouTube ↗</a></div></div></div>';
    return html;
  }

  var activeMatraIdx = 0;
  var wordViewMode = "table"; // "table" | "drill"

  function renderLesson(n, l) {
    document.title = "Day " + n + " · " + (l.title || topicOf(n)) + " · Sanskritam Daily";
    setActiveNav("lesson");
    var st = state(n), date = parseDate(l.date) || dayDate(n);
    var savedName = "";
    try { savedName = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}

    var html = '<nav class="crumbs"><a href="#home">‹ Course Syllabus</a><span class="muted">Day ' + n + " of 111 · " + esc(stageOf(n)) + "</span></nav>";
    html += '<div class="lesson-shell"><div class="lesson-main">';

    html += '<header class="lesson-h"><span class="eyebrow">Sanskrit Day ' + n + (isReview(n) ? " · Review Lesson" : "") + " · " + fmt(date, true) + "</span><h1>" + esc(l.title || topicOf(n)) + "</h1>";

    if (l.idea) {

      html += '<section class="section" id="sec-examples"><h2><span class="h2-left"><span class="k">03</span>Examples</span><span class="small muted">Click Listen on any row to hear pronunciation</span></h2><ul class="rows">' + l.examples.map(row).join("") + "</ul></section>";
    }

    // Step 4: Say it Aloud (with 3-rep counter, name customizer, and voice recorder)
    if (l.sayAloud && l.sayAloud.length) {
      html += '<section class="section" id="sec-say"><h2><span class="h2-left"><span class="k">04</span>Say it aloud</span><span class="small muted">Repeat 3 times slowly · Every written अ is spoken</span></h2>';

        if (hasBlank) {
          html += '<div class="name-fill-row"><label for="learnerNameInp">Personalize with your name:</label><input type="text" id="learnerNameInp" placeholder="e.g. आदित्यः / Āditya" value="' + esc(savedName) + '"></div>';

        html += '<div class="say-actions">';
        html += '<button type="button" class="ctl-btn" data-speak-say="' + sIdx + '" data-raw-dev="' + esc(x.dev) + '">🔊 Hear Model</button>';

        html += '<audio id="rec-audio-' + sIdx + '" controls hidden style="height:2rem;max-width:14rem"></audio>';
        html += "</div></li>";
      });
      html += "</ul></section>";
    }

    // Step 5: New Words (with Table / Recall Cards switcher)
    if (l.words && l.words.length) {
      html += '<section class="section" id="sec-words"><h2><span class="h2-left"><span class="k">05</span>New words (' + l.words.length + ')</span>';

      html += '<div class="ctl"><span>Speed:</span><button class="ctl-btn sel" type="button" data-rate="1">1.0× Normal</button><button class="ctl-btn" type="button" data-rate="0.85">0.85× Measured</button><button class="ctl-btn" type="button" data-rate="0.7">0.7× Slow</button><button class="ctl-btn" type="button" id="rewBtn">↺ Rewind 5s</button><button class="ctl-btn" type="button" id="audBtn">Mark Listened</button></div></div></section>';
    }

    // Step 7: Quiz
    if (l.quiz && l.quiz.length) {
      html += '<section class="section" id="sec-quiz"><h2><span class="h2-left"><span class="k">07</span>Self-Check Quiz</span><span class="small muted">' + l.quiz.length + ' questions</span></h2>';
      if (st.teacher && st.teacher.total) html += '<div class="teacher">Checked by your teacher: ' + st.teacher.score + " of " + st.teacher.total + (st.teacher.checked ? " · " + fmt(parseDate(st.teacher.checked) || Date.now()) : "") + (st.teacher.note ? '<br><span style="color:var(--fg)">' + inline(st.teacher.note) + "</span>" : "") + "</div>";
      html += '<div class="quiz" id="quiz">';
      l.quiz.forEach(function (q, i) {
        html += '<div class="q" data-i="' + i + '"><div class="qt"><span class="qn">' + (i + 1) + ".</span><span>" + inline(q.q) + "</span></div>";
        if (q.options && q.options.length) {
          html += '<ul class="opts">' + q.options.map(function (o, j) { return '<li><button class="opt" type="button" data-j="' + j + '"><span class="l">' + String.fromCharCode(97 + j) + ")</span><span>" + inline(o) + "</span></button></li>"; }).join("") + "</ul>";
        } else {
          html += '<input type="text" id="q' + n + "-" + i + '" placeholder="Type your answer" autocomplete="off" autocapitalize="off" spellcheck="false">';
        }
        html += '<div class="why" hidden></div></div>';
      });
      html += '<div class="btn-row"><button class="btn" type="button" id="checkBtn">Check My Answers</button><button class="btn secondary" type="button" id="retryQuizBtn" hidden>Reset &amp; Retry Quiz</button><button class="btn secondary" type="button" id="copyQuizBtn">Copy Answers for Teacher Chat</button><span class="note" id="copyStatusNote"></span></div>';
      html += '<div class="result" id="result"' + (st.quiz ? "" : " hidden") + '><span>' + (st.quiz ? "Your last self-check: " + st.quiz.score + " of " + st.quiz.total + " · " + fmt(istDate(Date.parse(st.quiz.at))) : "") + "</span></div></div></section>";
    }

    if (l.extra) html += '<section class="section"><h2><span class="h2-left"><span class="k">+</span>Extra practice</span></h2><div class="extra">' + inline(l.extra) + "</div></section>";

    var prev = n > 1 && n - 1 <= (latest || 0) ? n - 1 : 0, next = n + 1 <= (latest || 0) ? n + 1 : 0;
    html += '<nav class="navrow"><span>' + (prev ? '<a href="#day-' + prev + '">‹ Day ' + prev + ": " + esc(topicOf(prev)) + "</a>" : '<a href="#home">‹ Course Home</a>') + "</span><span>" + (next ? '<a href="#day-' + next + '">Day ' + next + ": " + esc(topicOf(next)) + " ›</a>" : '<span class="muted">Day ' + (n + 1) + " (" + esc(topicOf(n + 1)) + ") arrives " + fmt(dayDate(n + 1)) + "</span>") + "</span></nav>";
    html += "</div>"; // end .lesson-main

    // Right Companion Rail
    var notesMap = loadNotes();
    html += '<aside class="lesson-rail" aria-label="Lesson companion tools">';
    html += '<div class="rail-card"><h3>Lesson Steps</h3><ul class="toc-list" id="railToc"></ul>';
    html += '<div style="margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--line)"><button class="btn subtle" style="width:100%" id="doneBtn" type="button">' + (st.done ? "✓ Lesson Completed" : "Mark Lesson Done") + "</button></div></div>";

    html += '<div class="rail-card"><h3>IAST &amp; Sound Key</h3><div class="iast-key-grid">';
    [
      ["आ", "ā · long a (2 beats)"],
      ["ई", "ī · long i (2 beats)"],
      ["ऊ", "ū · long u (2 beats)"],
      ["ऋ", "ṛ · retroflex vowel"],
      ["ऐ", "ai · a + i (aisle)"],
      ["औ", "au · a + u (loud)"],
      ["ं", "ṃ · anusvāra dot"],
      ["ः", "ḥ · visarga breath"]
    ].forEach(function (pair) {
      html += '<div class="iast-key-item"><span class="dev">' + pair[0] + '</span><span class="muted">' + pair[1] + "</span></div>";
    });
    html += '</div><div style="margin-top:.65rem"><a href="#varnamala" class="small">Open full Varṇamālā chart →</a></div></div>';

    html += '<div class="rail-card"><h3>Personal Study Notes (Day ' + n + ')</h3>';
    html += '<textarea class="notes-area" id="lessonNotes" placeholder="Jot down vowel pairs, questions for the chat, or words to review…">' + esc(notesMap[n] || "") + '</textarea>';
    html += '<div class="note" id="notesSavedIndicator" style="margin-top:.3rem">Saved automatically in this browser.</div></div>';
    html += "</aside></div>"; // end .lesson-shell

    app.innerHTML = html;
    window.scrollTo(0, 0);
    wireLesson(n, l);
  }

  function buildMatraDetailHTML(mv) {
    return '<div class="matra-detail-left"><div><span class="dev" style="font-size:1.45rem;color:var(--accent);margin-right:.45rem">' + esc(mv.dev) + '</span><strong class="iast">' + esc(mv.iast) + '</strong> · <span>' + esc(mv.type) + ' (' + mv.beats + (mv.beats === 1 ? " beat" : " beats") + ')</span> · <span class="muted">' + esc(mv.sthana) + '</span></div>' +
      '<div class="small muted">Examples: ' + inline(mv.ex) + " — " + inline(mv.note) + '</div></div>' +
      '<button type="button" class="ctl-btn" id="matraSpeakBtn" data-speak="' + esc(mv.dev) + '">🔊 Hear ' + esc(mv.dev) + '</button>';
  }

  function renderWordsSectionContent(words) {
    if (wordViewMode === "table") {
      return '<ul class="rows">' + words.map(row).join("") + "</ul>";
    }
    return '<div class="drill-grid">' + words.map(function (w, idx) {
      return '<button type="button" class="drill-card" data-drill-card="' + idx + '">' +
        '<div><div class="dev">' + esc(w.dev) + '</div><div class="iast" style="color:var(--accent)">' + esc(w.iast) + '</div></div>' +
        '<div class="back" hidden><strong>' + esc(w.meaning) + '</strong></div>' +
        '<div class="hint">Click to reveal meaning &amp; hear</div></button>';
    }).join("") + "</div>";
  }

  function norm(s) { return String(s || "").toLowerCase().replace(/[\s।॥.,;:!?'"()\-–—]/g, "").replace(/ṁ/g, "ṃ"); }

  function wireLesson(n, l) {
    function renderSteps() {
      var st = state(n), el = document.getElementById("steps");
      var quizDone = !!(st.quiz || (st.teacher && st.teacher.total));
      var parts = [
        ["#sec-video", "01", "Video", st.video],
        ["#sec-idea", "02", "Today’s idea", st.video || st.audio || quizDone || st.done],
        ["#sec-examples", "03", "Examples", st.video || st.audio || quizDone || st.done],
        ["#sec-say", "04", "Say it aloud", Object.keys(local.reps || {}).some(function (k) { return k.indexOf(n + "-") === 0 && local.reps[k] > 0; }) || st.done],
        ["#sec-words", "05", "New words", st.audio || quizDone || st.done],
        ["#sec-audio", "06", "Audio", st.audio || !l.audio],
        ["#sec-quiz", "07", "Quiz", quizDone]
      ];
      if (el) {
        el.innerHTML =
          '<span class="step-item' + (st.video ? " on" : "") + '">' + (st.video ? "✓ " : "○ ") + 'Video</span>' +
          '<span class="meta-sep">·</span>' +
          '<span class="step-item' + (st.audio ? " on" : "") + '">' + (st.audio ? "✓ " : "○ ") + 'Audio</span>' +
          '<span class="meta-sep">·</span>' +
          '<span class="step-item' + (quizDone ? " on" : "") + '">' + (quizDone ? "✓ " : "○ ") + 'Quiz</span>' +
          (st.done ? '<span class="meta-sep">·</span><span class="step-item on">✓ Lesson Complete</span>' : "");
      }
      var toc = document.getElementById("railToc");
      if (toc) {
        toc.innerHTML = parts.map(function (p) {
          return '<li><a href="' + p[0] + '"><span><span class="k">' + p[1] + '</span>' + p[2] + '</span><span class="st-mark' + (p[3] ? " on" : "") + '">' + (p[3] ? "✓" : "·") + "</span></a></li>";
        }).join("");
      }
      var db = document.getElementById("doneBtn");
      if (db) {
        db.className = "ctl-btn" + (st.done ? " on" : "");
        db.style.width = "100%";
        db.style.justifyContent = "center";
        db.textContent = st.done ? "✓ Lesson Completed" : "Mark Lesson Done";
      }
      Array.prototype.forEach.call(document.querySelectorAll("[data-watch]"), function (b) {
        var k = b.getAttribute("data-watch") === "0" ? "video" : "alt";
        var isOn = !!(local.days[n] || {})[k];
        b.classList.toggle("on", isOn);
        b.textContent = isOn ? "✓ Watched" : "Mark Watched";
      });
      var ab = document.getElementById("audBtn");
      if (ab) {
        ab.classList.toggle("on", st.audio);
        ab.textContent = st.audio ? "✓ Listened" : "Mark Listened";
      }
    }
    renderSteps();

    document.getElementById("doneBtn").addEventListener("click", function () {
      var on = !state(n).done;
      mark(n, { done: on ? new Date().toISOString() : null });
      renderSteps();
    });

    // Video tabs & YouTube players
    var hasVideo = !!(l.video && ytId(l.video.url));
    if (hasVideo) {
      loadYT();
      attachPlayer({ id: "yt-0", onEnd: function () { if (!(local.days[n] || {}).video) { mark(n, { video: new Date().toISOString() }); renderSteps(); } } });
      if (l.altVideo && ytId(l.altVideo.url)) attachPlayer({ id: "yt-1", onEnd: function () { mark(n, { alt: new Date().toISOString(), video: (local.days[n] || {}).video || new Date().toISOString() }); renderSteps(); } });
    }
    Array.prototype.forEach.call(document.querySelectorAll("[data-vtab]"), function (b) {
      b.addEventListener("click", function () {
        var mode = b.getAttribute("data-vtab");
        Array.prototype.forEach.call(document.querySelectorAll("[data-vtab]"), function (x) { x.classList.toggle("active", x === b); });
        var p0 = document.getElementById("player-wrap-0"), p1 = document.getElementById("player-wrap-1");
        if (p0) p0.hidden = mode === "1";
        if (p1) p1.hidden = mode === "0";
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-watch]"), function (b) {
      b.addEventListener("click", function () {
        var k = b.getAttribute("data-watch") === "0" ? "video" : "alt", d = local.days[n] || {}, patch = {};
        patch[k] = d[k] ? null : new Date().toISOString();
        if (k === "alt" && !d[k] && !d.video) patch.video = patch[k];
        mark(n, patch); renderSteps();
      });
    });

    // Interactive Matra Lab on Day 1
    Array.prototype.forEach.call(document.querySelectorAll("[data-matra]"), function (b) {
      b.addEventListener("click", function () {
        activeMatraIdx = +b.getAttribute("data-matra");
        var mv = VOWELS_DATA[activeMatraIdx];
        Array.prototype.forEach.call(document.querySelectorAll("[data-matra]"), function (x) { x.classList.toggle("active", x === b); });
        var det = document.getElementById("matraDetail");
        if (det && mv) {
          det.innerHTML = buildMatraDetailHTML(mv);
          var msb = document.getElementById("matraSpeakBtn");
          if (msb) msb.addEventListener("click", function () { speakSanskrit(mv.dev); });
        }
        if (mv) speakSanskrit(mv.dev);
      });
    });
    var msbInit = document.getElementById("matraSpeakBtn");
    if (msbInit) msbInit.addEventListener("click", function () { speakSanskrit(msbInit.getAttribute("data-speak")); });

    // Speak buttons for Examples & Words
    bindSpeakButtons();

    // Step 4: Say it aloud interactions (Name input, 3-rep counter, Voice Recorder)
    var nameInp = document.getElementById("learnerNameInp");
    if (nameInp) {
      nameInp.addEventListener("input", function () {
        var val = nameInp.value.trim();
        try { localStorage.setItem(NAME_KEY, val); } catch (e) {}
        (l.sayAloud || []).forEach(function (x, idx) {
          if (typeof x === "string") x = { dev: x };
          if (/______|\.\.\./.test(x.dev || "")) {
            var dEl = document.getElementById("say-dev-" + idx);
            var sEl = document.getElementById("say-sub-" + idx);
            if (dEl) dEl.textContent = val ? x.dev.replace(/______/, val) : x.dev;
            if (sEl) {
              var iastTxt = val ? (x.iast || "").replace(/\.\.\./, val) : (x.iast || "");
              sEl.innerHTML = (iastTxt ? '<span class="iast">' + esc(iastTxt) + "</span>" : "") + (x.meaning ? " · " + esc(x.meaning) : "");
            }
          }
        });
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll("[data-speak-say]"), function (b) {
      b.addEventListener("click", function () {
        var idx = +b.getAttribute("data-speak-say");
        var dEl = document.getElementById("say-dev-" + idx);
        speakSanskrit(dEl ? dEl.textContent : b.getAttribute("data-raw-dev"));
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-rep]"), function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-rep");
        if (!local.reps) local.reps = {};
        var cur = (local.reps[key] || 0) + 1;
        if (cur > 3) cur = 0;
        local.reps[key] = cur;
        saveLocal(local);
        b.classList.toggle("on", cur >= 3);
        b.textContent = cur >= 3 ? "✓ Spoken 3 / 3 times" : "Count Repetition (" + cur + " / 3)";
        renderSteps();
      });
    });

    // Browser microphone voice recorder for pronunciation comparison
    var activeRecorders = {};
    Array.prototype.forEach.call(document.querySelectorAll("[data-rec-btn]"), function (b) {
      b.addEventListener("click", function () {
        var idx = b.getAttribute("data-rec-btn");
        var audOut = document.getElementById("rec-audio-" + idx);
        if (activeRecorders[idx] && activeRecorders[idx].state === "recording") {
          activeRecorders[idx].stop();
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          b.textContent = "Mic unavailable in this browser";
          return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          var chunks = [];
          var rec = new MediaRecorder(stream);
          activeRecorders[idx] = rec;
          b.classList.add("rec");
          b.textContent = "⏹ Stop Recording";
          rec.ondataavailable = function (e) { if (e.data && e.data.size > 0) chunks.push(e.data); };
          rec.onstop = function () {
            stream.getTracks().forEach(function (t) { t.stop(); });
            b.classList.remove("rec");
            b.textContent = "🎙 Re-record Voice";
            var blob = new Blob(chunks, { type: "audio/webm" });
            if (audOut) {
              audOut.src = URL.createObjectURL(blob);
              audOut.hidden = false;
              audOut.play().catch(function () {});
            }
          };
          rec.start();
        }).catch(function () {
          b.textContent = "Allow microphone access to record";
        });
      });
    });

    // Step 5: Words Table vs Drill Cards switcher
    function wireDrillCards() {
      Array.prototype.forEach.call(document.querySelectorAll("[data-drill-card]"), function (card) {
        card.addEventListener("click", function () {
          var back = card.querySelector(".back");
          var hint = card.querySelector(".hint");
          var devTxt = card.querySelector(".dev").textContent;
          if (back) {
            var nowHidden = !back.hidden;
            back.hidden = nowHidden;
            if (hint) hint.textContent = nowHidden ? "Click to reveal meaning & hear" : "✓ Meaning revealed · click to hide";
            if (!nowHidden) speakSanskrit(devTxt);
          }
        });
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll("[data-wmode]"), function (b) {
      b.addEventListener("click", function () {
        wordViewMode = b.getAttribute("data-wmode");
        Array.prototype.forEach.call(document.querySelectorAll("[data-wmode]"), function (x) { x.classList.toggle("active", x === b); });
        var wc = document.getElementById("wordsContainer");
        if (wc && l.words) {
          wc.innerHTML = renderWordsSectionContent(l.words);
          bindSpeakButtons();
          wireDrillCards();
        }
      });
    });
    wireDrillCards();

    // Step 6: Audio controls
    var audioEl = document.getElementById("aud");
    if (audioEl) {
      audioEl.addEventListener("ended", function () { if (!(local.days[n] || {}).audio) { mark(n, { audio: new Date().toISOString() }); renderSteps(); } });
      Array.prototype.forEach.call(document.querySelectorAll(".ctl-btn[data-rate]"), function (b) {
        b.addEventListener("click", function () {
          audioEl.playbackRate = +b.getAttribute("data-rate");
          Array.prototype.forEach.call(document.querySelectorAll(".ctl-btn[data-rate]"), function (x) { x.classList.toggle("sel", x === b); });
        });
      });
      var rewBtn = document.getElementById("rewBtn");
      if (rewBtn) {
        rewBtn.addEventListener("click", function () {
          audioEl.currentTime = Math.max(0, (audioEl.currentTime || 0) - 5);
          audioEl.play().catch(function () {});
        });
      }
      document.getElementById("audBtn").addEventListener("click", function () {
        mark(n, { audio: (local.days[n] || {}).audio ? null : new Date().toISOString() });
        renderSteps();
      });
    }

    // Personal Study Notes
    var notesEl = document.getElementById("lessonNotes");
    var notesInd = document.getElementById("notesSavedIndicator");
    if (notesEl) {
      notesEl.addEventListener("input", function () {
        saveNote(n, notesEl.value);
        if (notesInd) notesInd.textContent = "✓ Saved just now.";
      });
    }

    // Step 7: Quiz
    var quiz = document.getElementById("quiz");
    if (!quiz) return;
    var picked = {}, self = {}, lastScore = null;
    Array.prototype.forEach.call(quiz.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () {
        var qEl = b.closest(".q"), i = +qEl.getAttribute("data-i");
        if (qEl.getAttribute("data-checked")) return;
        picked[i] = +b.getAttribute("data-j");
        Array.prototype.forEach.call(qEl.querySelectorAll(".opt"), function (x) { x.classList.toggle("sel", x === b); });
      });
    });

    var checkBtn = document.getElementById("checkBtn");
    var retryBtn = document.getElementById("retryQuizBtn");
    var copyBtn = document.getElementById("copyQuizBtn");
    var copyNote = document.getElementById("copyStatusNote");

    checkBtn.addEventListener("click", function () {
      var score = 0, total = l.quiz.length, open = 0;
      l.quiz.forEach(function (q, i) {
        var qEl = quiz.querySelector('.q[data-i="' + i + '"]'), why = qEl.querySelector(".why");
        qEl.setAttribute("data-checked", "1");
        var ansText = String(q.answer == null ? "" : q.answer);
        if (q.options && q.options.length) {
          var ai = /^[a-z]$/i.test(ansText.trim()) ? ansText.trim().toLowerCase().charCodeAt(0) - 97 : q.options.findIndex(function (o) { return norm(o) === norm(ansText); });
          var ok = picked[i] === ai;
          if (ok) score++;
          Array.prototype.forEach.call(qEl.querySelectorAll(".opt"), function (x, j) { x.classList.remove("sel"); if (j === ai) x.classList.add("right"); else if (j === picked[i]) x.classList.add("wrong"); x.disabled = true; });
          why.className = "why " + (ok ? "right" : "wrong");
          why.innerHTML = (ok ? "<strong>Right.</strong> " : picked[i] == null ? "<strong>Not answered.</strong> " : "<strong>Not quite.</strong> ") + inline(q.why || "");
          why.hidden = false;
        } else {
          var inp = qEl.querySelector("input"), given = inp ? inp.value : "";
          var accepted = [ansText].concat(q.accept || []);
          var auto = given.trim() && accepted.some(function (a) { return norm(a) === norm(given); });
          if (inp) inp.disabled = true;
          if (auto) { score++; why.className = "why right"; why.innerHTML = "<strong>Right.</strong> " + inline(q.why || ""); why.hidden = false; }
          else {
            open++;
            why.className = "why";
            why.innerHTML = "<strong>Answer:</strong> " + inline(ansText) + (q.why ? "<br>" + inline(q.why) : "") + '<div class="selfmark"><button class="ctl-btn" type="button" data-self="1">I had it right</button><button class="ctl-btn" type="button" data-self="0">I missed it</button></div>';
            why.hidden = false;
            Array.prototype.forEach.call(why.querySelectorAll("[data-self]"), function (b) {
              b.addEventListener("click", function () {
                self[i] = b.getAttribute("data-self") === "1";
                Array.prototype.forEach.call(why.querySelectorAll("[data-self]"), function (x) { x.classList.toggle("sel", x === b); });
                why.className = "why " + (self[i] ? "right" : "wrong");
                finish();
              });
            });
          }
        }
      });
      this.disabled = true;
      if (retryBtn) retryBtn.hidden = false;
      function finish() {
        var s = score; for (var k in self) if (self[k]) s++;
        lastScore = s;
        var res = document.getElementById("result"), waiting = open - Object.keys(self).length;
        res.hidden = false;
        res.innerHTML = "<span><strong>Score: " + s + " of " + total + "</strong>" + (waiting > 0 ? " so far. Mark the typed answers above." : s === total ? " · Excellent mastery." : s >= total - 1 ? " · Good work. Re-read the one you missed." : " · Read today’s idea once more, then try the audio again.") + "</span>";
        if (waiting <= 0) { mark(n, { quiz: { score: s, total: total, at: new Date().toISOString() }, done: (local.days[n] || {}).done || new Date().toISOString() }); renderSteps(); }
      }
      finish();
    });

    if (retryBtn) {
      retryBtn.addEventListener("click", function () {
        picked = {}; self = {}; lastScore = null;
        checkBtn.disabled = false;
        retryBtn.hidden = true;
        Array.prototype.forEach.call(quiz.querySelectorAll(".q"), function (qEl) {
          qEl.removeAttribute("data-checked");
          Array.prototype.forEach.call(qEl.querySelectorAll(".opt"), function (o) {
            o.classList.remove("sel", "right", "wrong");
            o.disabled = false;
          });
          var inp = qEl.querySelector("input");
          if (inp) { inp.disabled = false; inp.value = ""; }
          var why = qEl.querySelector(".why");
          if (why) { why.hidden = true; why.innerHTML = ""; }
        });
      });
    }

    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        var lines = ["Sanskritam Daily · Day " + n + " (" + (l.title || topicOf(n)) + ") Quiz Answers:"];
        l.quiz.forEach(function (q, i) {
          if (q.options && q.options.length) {
            var pIdx = picked[i];
            var letter = pIdx != null ? String.fromCharCode(97 + pIdx) : "–";
            var optText = pIdx != null && q.options[pIdx] ? q.options[pIdx] : "unanswered";
            lines.push((i + 1) + ". " + letter + ") " + optText);
          } else {
            var inp = document.getElementById("q" + n + "-" + i);
            lines.push((i + 1) + ". " + (inp && inp.value.trim() ? inp.value.trim() : "unanswered"));
          }
        });
        var stNow = state(n);
        if (lastScore != null) lines.push("Self-check score: " + lastScore + "/" + l.quiz.length);
        else if (stNow.quiz) lines.push("Self-check score: " + stNow.quiz.score + "/" + stNow.quiz.total);
        var text = lines.join("\n");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            if (copyNote) copyNote.textContent = "✓ Copied to clipboard! Paste into your Sanskrit Day chat.";
          }).catch(function () {
            if (copyNote) copyNote.textContent = text;
          });
        } else if (copyNote) {
          copyNote.textContent = text;
        }
      });
    }
  }

  // ---------- router ----------
  var teacherLoaded = loadTeacher();
  function route() {
    var h = location.hash || "#home";
    var m = /^#day-(\d{1,3})$/.exec(h);
    if (m) {
      var n = +m[1];
      app.innerHTML = '<nav class="crumbs"><a href="#home">‹ Course</a></nav><div class="empty">Loading Day ' + n + "…</div>";
      Promise.all([teacherLoaded, loadLatest()]).then(function () { return loadLesson(n); }).then(function (l) { renderLesson(n, l); updateHeaderStatus(); }).catch(function () {
        setActiveNav("lesson");
        app.innerHTML = '<nav class="crumbs"><a href="#home">‹ Course Syllabus</a></nav><div class="empty"><strong>Day ' + n + " (" + esc(topicOf(n)) + ") isn’t published yet.</strong><br>" + (n >= 2 ? "It is scheduled for " + fmt(dayDate(n), true) + " at " + LESSON_TIME + "." : "") + '<div class="btn-row" style="margin-top:.8rem"><a class="btn" href="#day-1">Open Day 1</a><a class="btn secondary" href="#varnamala">Study Varṇamālā Sounds</a></div></div>';
      });
    } else if (h === "#varnamala") {
      Promise.all([teacherLoaded, loadLatest()]).then(function () {
        renderVarnamala();
        updateHeaderStatus();
      });
    } else if (h === "#words") {
      Promise.all([teacherLoaded, loadLatest()]).then(function (r) {
        var has = r[1] || 1, loads = [];
        for (var d = 1; d <= has; d++) loads.push(loadLesson(d).catch(function () { return null; }));
        return Promise.all(loads);
      }).then(function () {
        renderWordsView();
        updateHeaderStatus();
      });
    } else {
      Promise.all([teacherLoaded, loadLatest()]).then(function (r) {
        var has = r[1], show = Math.min(Math.max(1, todayDay()), has || 0);
        return show >= 1 ? loadLesson(show).catch(function () { return null; }) : null;
      }).then(function () { renderHome(); updateHeaderStatus(); }).catch(function () { renderHome(); });
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
